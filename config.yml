# Data configuration
data:
  domain: NZ # one of SA, ALPS or NZ
  training_experiment: ESD_pseudo_reality # ESD_pseudo_reality or Emulator_hist_future
  data_path: /bg/fast/aihydromet/cordexbench/
  var_target: pr     # tasmax or pr 
  normalization: "mp1p1_input_minmaxlog_target"   #'standardization', 'minmax', 'log', or None, or 'minus1_to_plus1' or "m1p1_log_target" or "mp1p1_input_m1p1log_target" or "mp1p1_input_minmaxlog_target"
  log_base: 10.0  # Base for log transform in log-based normalizations (default: e for natural log, use 10.0 for log10)
  num_workers: 4
  t_past: 0  # number of past time steps as input
  t_future: 0  # number of future time steps to predict
  use_orography: false  # whether to include orography as additional static input
  use_doy: true  # whether to use day of year as timestep (replaces zero timestep with seasonal conditioning)

# Training configuration
training:
  batch_size: 32
  ensemble_size: 5
  noise_std_gen: 0.05  # standard deviation of Gaussian noise channel added to generator input (for diffusion unet)
  epochs: 200
  batches_per_epoch:       # set to null to use all data; otherwise set an integer value
  batches_per_validation: 10  # set to null to use all data; otherwise set an integer value
  n_critic: 2  # number of discriminator updates per generator update
  gradient_penalty_weight: 0.0  # R1 gradient penalty weight for discriminator regularization (0.0 to disable, typical: 0.1-1.0)
  # Learning rate scheduler with warmup and exponential decay
  warmup_epochs: 5  # Number of epochs for linear warmup phase
  plateau_epochs: 10  # Number of epochs to maintain target LR before decay starts
  transition_epochs: 250  # Number of epochs over which to transition to decayed LR
  lr_decay_gamma: 0.97  # Exponential decay factor applied after plateau (lr *= gamma each epoch)
  warmup_start_lr: 1.0e-7  # Starting learning rate for warmup phase
  generator:
    learning_rate: 0.00005
    optimizer: "Adam"
    scheduler:
    beta1: 0.0
    beta2: 0.999
    weight_decay: 0.0001
  discriminator:
    learning_rate: 0.0005
    optimizer: "Adam"
    scheduler:
    beta1: 0.0
    beta2: 0.999
    weight_decay: 0.0001
    noise_std: 0.1  # standard deviation of Gaussian noise added to real and fake inputs for regularization
  # early_stopping: true # not implemented
  # patience: 10 # not implemented
  checkpoint_dir: "checkpoints"
  fss_loss: false # mainly for precip
  noise_type: "global" # "global" (single scalar) or "spatial" (per-pixel map)
  noise_init: 0.05 # Initial noise scale (use 0.05 for tasmax, 0.1 for pr)
  noise_min: 0.0 # Minimum allowed noise scale
  noise_max: 1.0 # Maximum allowed noise scale
  # Loss weights
  loss_weights:
    l1: 1.0
    mse: 1.0
    gan: 0.01
    fss: 0.0
    diversity: 0.1 # Diversity bonus to encourage ensemble spread (negative variance loss)

# Model configuration
model:
  architecture: "diffusion_unet" # "diffusion_unet" or "spategan"
  use_learnable_upsampler: false # Use learnable conv-based upsampling instead of fixed bilinear
  # Generator architecture configurations
  generator:
    diffusion_unet:
      sample_size: [128, 128]
      in_channels: 16  # 15 input + 1 noise
      out_channels: 1
      layers_per_block: 1
      block_out_channels:
      - 32
      - 64
      - 128
      - 256
      down_block_types:
      - "DownBlock2D"
      - "DownBlock2D"
      - "DownBlock2D"
      - "AttnDownBlock2D"
      up_block_types:
      - "AttnUpBlock2D"
      - "UpBlock2D"
      - "UpBlock2D"
      - "UpBlock2D"
    spategan:
      filter_size: 96
      n_input_channels: 15
      n_output_channels: 1
      dropout_seed: 42
      dropout_ratio: 0.2

  # Legacy fields for backward compatibility
  discriminator_architecture: "spategan" # "unet" or "spategan"
  filter_size: 96
  n_input_channels: 15
  n_output_channels: 1
  dropout_seed: 42
  dropout_ratio: 0.2

  # Discriminator architecture config
  discriminator:
    # High-resolution path channels (for target/prediction at 128x128)
    # Each entry creates one ResidualBlock2D with stride=2 (except first with stride=1)
    # REDUCED from [128, 256, 256, 256, 128] to prevent overfitting
    # 3 blocks: 128 -> 128 (s=1) -> 64 (s=2) -> 32 (s=2) = 32x32 output
    hr_channels: [64, 64, 32]
    # Low-resolution path channels (for coarse input at 16x16)
    # Each entry creates one ResidualBlock2D with stride=2 (except first with stride=1)
    # REDUCED from [128, 128] to prevent overfitting
    # Must match HR path spatial dims: 16 -> 16 (s=1) -> 32 (s=2 UPSAMPLE) = 32x32 output
    # Using negative stride to indicate upsample is not supported, so we need 1 block: 16 -> 16
    lr_channels: [32]
    # Use LR path (coarse input)? Set to false for ablation baseline (HR only)
    use_lr_path: false
    # Combined path channels after concatenating hr and lr features
    # Each entry creates one ResidualBlock2D with stride=2
    # REDUCED from [256] to prevent overfitting
    combined_channels: [32]
    # Output head channels (final should be 1 for binary classification)
    # Creates Conv2d layers with LeakyReLU between (except last layer)
    # REDUCED from [64, 1] to prevent overfitting
    output_channels: [32, 1]
    # Dropout rate for regularization (0.0 to disable)
    dropout: 0.2
    # Enable spectral normalization for stability
    spectral_norm: false

# Evaluation configuration
evaluation:
  metrics: ["rmse"]
  output_dir: "results"

# Logging configuration
logging:
  level: "INFO"
  log_dir: "logs"
  wandb: false # not implemented
  log_frequency: 1 # number of epochs between loss plots
  checkpoint_frequency: 100 # number of epochs between checkpoints
  map_frequency: 20 # number of epochs between plotting maps
  diagnostic_frequency: 5 # number of epochs between computing diagnostics
